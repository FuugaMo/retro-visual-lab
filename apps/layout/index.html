<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Win98 Gig Widget Lab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <span class="brand-icon" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">WINDOWS 98 COMPONENT WORKBENCH</p>
          <h1>Gig Widget Lab</h1>
        </div>
      </div>
      <div class="header-actions">
        <label class="win-button file-button">
          上传底图
          <input id="backgroundInput" type="file" accept="image/*" hidden />
        </label>
        <label class="win-button file-button">
          上传图片
          <input id="imageInput" type="file" accept="image/*" hidden />
        </label>
        <button class="win-button" id="saveLayoutButton">保存当前布局</button>
        <button class="win-button" id="clearBackground">清除底图</button>
        <button class="win-button primary" id="exportButton">导出 PNG</button>
      </div>
    </header>

    <main class="workspace">
      <aside class="tool-panel win-panel">
        <section>
          <div class="section-title">01 / 添加组件</div>
          <div class="preset-grid">
            <button class="preset-card" data-add="lineup">
              <span class="preset-icon list-icon"></span>
              <strong>LINE-UP</strong>
              <small>阵容列表窗口</small>
            </button>
            <button class="preset-card" data-add="time">
              <span class="preset-icon clock-icon"></span>
              <strong>DATE / TIME</strong>
              <small>日期时间与场地窗口</small>
            </button>
            <button class="preset-card" data-add="calendar">
              <span class="preset-icon calendar-icon"></span>
              <strong>CALENDAR</strong>
              <small>日历与时钟窗口</small>
            </button>
            <button class="preset-card" data-add="address">
              <span class="preset-icon doc-icon"></span>
              <strong>ADDRESS</strong>
              <small>地址详情窗口</small>
            </button>
            <button class="preset-card" id="uploadImageCard">
              <span class="preset-icon image-icon"></span>
              <strong>IMAGE</strong>
              <small>无边框图片图层</small>
            </button>
            <button class="preset-card" data-add="text">
              <span class="preset-icon text-icon">T</span>
              <strong>TEXT</strong>
              <small>亮黄色大标题</small>
            </button>
          </div>
        </section>

        <section>
          <div class="section-title">02 / 画布</div>
          <div class="field-row">
            <label for="ratioSelect">比例</label>
            <select id="ratioSelect" class="win-input">
              <option value="3:4">3:4 海报</option>
              <option value="4:3">4:3 横版</option>
              <option value="9:16">9:16 竖屏</option>
              <option value="1:1">1:1 方形</option>
            </select>
          </div>
          <div class="field-row">
            <label for="latinFontSelect">英文字体</label>
            <select id="latinFontSelect" class="win-input">
              <option value="pixel">Pixelated MS Sans Serif</option>
              <option value="pingfang">PingFang SC</option>
              <option value="fusion-8-prop">Fusion Pixel 8px 比例</option>
              <option value="fusion-10-prop">Fusion Pixel 10px 比例</option>
              <option value="fusion-pixel">Fusion Pixel 12px 比例</option>
              <option value="fusion-12-mono">Fusion Pixel 12px 等宽</option>
            </select>
          </div>
          <div class="field-row">
            <label for="cjkFontSelect">中文字体</label>
            <select id="cjkFontSelect" class="win-input">
              <option value="pingfang">PingFang SC</option>
              <option value="fusion-8-prop">Fusion Pixel 8px 比例</option>
              <option value="fusion-10-prop">Fusion Pixel 10px 比例</option>
              <option value="fusion-pixel">Fusion Pixel 12px 比例</option>
              <option value="fusion-12-mono">Fusion Pixel 12px 等宽</option>
            </select>
          </div>
          <label class="check-row">
            <input id="gridToggle" type="checkbox" checked />
            <span>显示对齐网格</span>
          </label>
          <label class="check-row">
            <input id="snapToggle" type="checkbox" checked />
            <span>吸附 8px 网格</span>
          </label>
          <div class="field-row range-row">
            <label for="bgOpacity">底图</label>
            <input id="bgOpacity" type="range" min="10" max="100" value="100" />
            <output id="bgOpacityValue">100%</output>
          </div>
          <div class="snapshot-panel" aria-label="布局快照">
            <div class="snapshot-row">
              <strong>快照 1</strong>
              <button class="win-button" type="button" data-save-snapshot="1">保存</button>
              <button class="win-button" type="button" data-load-snapshot="1">读取</button>
            </div>
            <div class="snapshot-row">
              <strong>快照 2</strong>
              <button class="win-button" type="button" data-save-snapshot="2">保存</button>
              <button class="win-button" type="button" data-load-snapshot="2">读取</button>
            </div>
          </div>
        </section>

        <section class="selected-controls">
          <div class="section-title">03 / 当前组件</div>
          <div id="emptySelection" class="empty-state">点击画布中的窗口进行编辑。</div>
          <div id="editorFields" hidden>
            <label class="field-stack" id="titleControl">
              <span>标题栏</span>
              <input id="titleInput" class="win-input" type="text" />
            </label>
            <label class="field-stack" id="contentControl">
              <span>内容（每行一项）</span>
              <textarea id="contentInput" class="win-input" rows="5"></textarea>
            </label>
            <div id="variantControl" class="field-stack" hidden>
              <span id="variantLabel">组件款式</span>
              <div id="variantChoices" class="variant-choices"></div>
            </div>
            <div class="two-col" id="styleControls">
              <label class="field-stack" id="themeControl">
                <span>主题</span>
                <select id="themeInput" class="win-input">
                  <option value="blue">Win98 蓝</option>
                  <option value="teal">青绿</option>
                  <option value="gray">灰阶</option>
                  <option value="pink">粉色</option>
                </select>
              </label>
              <label class="field-stack" id="fontSizeControl">
                <span>基础字号</span>
                <input id="fontSizeInput" class="win-input" type="number" min="12" max="72" />
              </label>
            </div>
            <label class="field-stack" id="textColorControl" hidden>
              <span>文字颜色</span>
              <input id="textColorInput" class="win-input color-input" type="color" value="#ffe744" />
            </label>
            <div class="field-stack typography-controls" id="typographyControl">
              <span>分区字体设置</span>
              <select id="typographyPartSelect" class="win-input" aria-label="文字分区"></select>
              <div class="typography-grid">
                <label class="field-stack">
                  <span>字体</span>
                  <select id="partFontFamily" class="win-input">
                    <option value="">跟随全局</option>
                    <option value="pingfang">PingFang SC</option>
                    <option value="fusion-8-prop">Fusion Pixel 8px</option>
                    <option value="fusion-10-prop">Fusion Pixel 10px</option>
                    <option value="fusion-pixel">Fusion Pixel 12px</option>
                    <option value="fusion-12-mono">Fusion Pixel 12px 等宽</option>
                    <option value="pixel">Pixelated MS Sans Serif</option>
                  </select>
                </label>
                <label class="field-stack">
                  <span>字号</span>
                  <input id="partFontSize" class="win-input" type="number" min="8" max="120" placeholder="默认" />
                </label>
                <label class="field-stack">
                  <span>字重</span>
                  <select id="partFontWeight" class="win-input">
                    <option value="">默认</option>
                    <option value="400">常规 400</option>
                    <option value="500">中等 500</option>
                    <option value="600">半粗 600</option>
                    <option value="700">粗体 700</option>
                    <option value="800">特粗 800</option>
                  </select>
                </label>
              </div>
              <button class="win-button typography-reset" id="resetTypographyButton" type="button">恢复此分区默认</button>
            </div>
            <label class="check-row" id="shadowControl">
              <input id="shadowInput" type="checkbox" checked />
              <span>窗口投影</span>
            </label>
            <div class="button-row">
              <button class="win-button" id="duplicateButton">复制</button>
              <button class="win-button" id="frontButton">置顶</button>
              <button class="win-button danger" id="deleteButton">删除</button>
            </div>
          </div>
        </section>
      </aside>

      <section class="stage-column">
        <div class="stage-toolbar win-panel">
          <div class="status-copy">
            <span class="status-light"></span>
            <span id="canvasStatus">900 × 1200 px</span>
          </div>
          <p>拖动标题栏移动，拖动右下角调整大小</p>
        </div>
        <div id="stageViewport" class="stage-viewport">
          <div id="stageScaler" class="stage-scaler">
            <div id="posterStage" class="poster-stage grid-on" tabindex="0">
              <div class="empty-canvas-message" id="emptyCanvasMessage">
                <span class="empty-folder"></span>
                <strong>UPLOAD A BACKGROUND</strong>
                <small>也可以先放置组件，再上传海报底图</small>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="status-bar">
      <span id="appStatus">READY</span>
      <span id="selectionStatus">NO WIDGET SELECTED</span>
      <span>LOCAL / NO UPLOAD</span>
    </footer>

    <script src="./vendor/html-to-image.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
